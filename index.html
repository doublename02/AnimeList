<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https:; connect-src 'self' https:; object-src 'none'; base-uri 'none'; form-action 'self'"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f4ef"><title>Anime Shelf · 我的动画手账</title><link rel="stylesheet" href="style.css?v=github-sync-1"></head>
<body>
<header><a class="brand" href="./"><span class="logo">ア</span> ANIME SHELF <small>私人动画手账</small></a><div class="header-actions"><button id="login" disabled>管理员登录</button><button id="add" class="primary" hidden>＋ 添加作品</button></div></header>
<main><div class="sync-bar"><span id="syncStatus" role="status">正在读取清单…</span><div><button id="refreshCloud">刷新清单</button><button id="retrySync" hidden>重试同步</button><button id="restoreBackup" hidden>恢复本地备份</button><a id="commitLink" target="_blank" rel="noreferrer" hidden>查看提交 ↗</a></div></div>
<section class="intro" aria-label="收藏统计"><div id="stats" class="stats"></div></section>
<section class="library"><div class="section-title"><h2>我的收藏 <span id="count"></span></h2><div class="tools"><button id="export">↓ 导出清单</button><button id="import" hidden>↑ 导入清单</button><input type="file" id="file" accept="application/json,.json" hidden></div></div>
<div class="filters"><div class="selectors"><input id="filter" type="search" placeholder="搜索收藏名称 / 制作公司" aria-label="搜索收藏"><select id="year" aria-label="年份"><option value="">所有年份</option></select><select id="season" aria-label="季度"><option value="">所有季度</option><option value="winter">冬季 · 1 月</option><option value="spring">春季 · 4 月</option><option value="summer">夏季 · 7 月</option><option value="autumn">秋季 · 10 月</option></select><select id="sort" aria-label="排序"><option value="added">添加时间</option><option value="date">放送时间</option><option value="title">作品名称</option></select><select id="direction" aria-label="排序方向"><option value="desc">倒序 ↓</option><option value="asc">正序 ↑</option></select></div></div>
<div id="grid" class="grid" aria-live="polite"></div><p class="storage">✳ 修改保存在此浏览器。导出清单并更新仓库中的 data/library.json，可同步到公开网页。</p></section>
</main><footer><span>ANIME SHELF <i> / </i> 留住看过的世界</span><span>作品资料来自 <a href="https://bgm.tv" target="_blank" rel="noreferrer">Bangumi 番组计划 ↗</a></span></footer>
<dialog id="searchDialog"><div class="dialog-head"><div><p class="eyebrow">DISCOVER YOUR NEXT STORY</p><h2>添加到书架</h2></div><button class="close" aria-label="关闭">×</button></div><p class="muted">搜索 Bangumi 动画作品，选择后确认资料。</p><form id="searchForm" class="search-form"><input id="query" required placeholder="输入中文名或原名，如：葬送的芙莉莲" aria-label="作品名称"><button class="primary">搜索</button></form><label class="season-option"><input type="checkbox" id="allSeasons" checked> 同时补齐本系列所有季度（TV / 网络动画）</label><div id="results" aria-live="polite"><p class="empty">从一部喜欢的动画开始。</p></div></dialog>
<dialog id="editDialog"><div class="dialog-head"><h2 id="editTitle">作品资料</h2><button class="close" aria-label="关闭">×</button></div><p id="seriesSummary" class="muted" hidden></p><form id="editForm"><div class="edit-layout"><img id="editCover" alt="作品封面"><div class="fields"><label>作品名称<input name="title" required maxlength="200"></label><label>原名<input name="original" maxlength="200"></label><label>制作公司<input name="studio" placeholder="资料缺失时可手动填写" maxlength="200"></label><div class="row"><label>年份<input name="year" type="number" min="1900" max="2200"></label><label>季度<select name="season"><option value="">未知</option><option value="winter">冬季</option><option value="spring">春季</option><option value="summer">夏季</option><option value="autumn">秋季</option></select></label></div><label>我的短评<textarea name="note" rows="3" maxlength="2000" placeholder="记下一点感想…"></textarea></label></div></div><div class="edit-actions"><a id="source" target="_blank" rel="noreferrer">在 Bangumi 查看 ↗</a><div><button id="delete" type="button" class="danger">移除作品</button><button id="saveEntry" type="submit" class="primary">保存到书架</button></div></div></form></dialog>
<dialog id="conflictDialog"><h2>合并云端修改</h2><p id="conflictInfo" class="muted"></p><form id="mergeForm"><div id="conflictChoices"></div><div class="conflict-actions"><button id="exportConflict" type="button">导出本地草稿</button><button id="useRemote" type="button">使用云端清单</button><button type="submit" class="primary">确认合并并同步</button></div></form></dialog><div id="toast" role="status"></div><script type="module" src="app.js?v=github-sync-2"></script>
</body></html>
